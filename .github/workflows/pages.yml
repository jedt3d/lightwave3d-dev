name: Publish Workbench to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript syntax
        run: |
          node --check assets/course.js
          node --check assets/app.js
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets examples _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' \
              | grep -qE '^[0-9]+$'; then
              echo "Pages artifact is available."
              exit 0
            fi
            echo "Pages artifact not visible yet (attempt $attempt/12)."
            sleep 5
          done
          echo "::error::Pages artifact is not visible after the bounded retry window."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
